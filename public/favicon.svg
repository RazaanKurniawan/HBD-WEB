<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EAA"/>
      <stop offset="100%" stop-color="#E07A5F"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FCEADE"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF7B54"/>
      <stop offset="40%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FFEAA7"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5D8F"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </linearGradient>
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Plate / Base Shadow -->
  <ellipse cx="32" cy="56" rx="27" ry="5.5" fill="#D4A373" opacity="0.35"/>
  <ellipse cx="32" cy="54.5" rx="25" ry="4.5" fill="#FAF6F0"/>
  <ellipse cx="32" cy="54" rx="23" ry="3.8" fill="#FFFFFF"/>

  <!-- Cake Bottom Tier -->
  <path d="M 12 39 Q 32 46 52 39 L 52 50 Q 32 57 12 50 Z" fill="url(#cakeGrad)"/>
  <ellipse cx="32" cy="39" rx="20" ry="5.5" fill="url(#creamGrad)"/>
  
  <!-- Frosting Scallops Bottom Tier -->
  <path d="M 12 39 Q 16 45 20 39 Q 24 46 28 39 Q 32 46 36 39 Q 40 46 44 39 Q 48 46 52 39 L 52 42 Q 48 48 44 42 Q 40 48 36 42 Q 32 48 28 42 Q 24 48 20 42 Q 16 47 12 42 Z" fill="#FCEADE" opacity="0.95"/>

  <!-- Cake Top Tier -->
  <path d="M 19 25 Q 32 30 45 25 L 45 35 Q 32 40 19 35 Z" fill="url(#cakeGrad)"/>
  <ellipse cx="32" cy="25" rx="13" ry="4" fill="url(#creamGrad)"/>
  
  <!-- Frosting Scallops Top Tier -->
  <path d="M 19 25 Q 23 30 27 25 Q 31 30 35 25 Q 39 30 42 25 Q 45 29 45 26 L 45 28 Q 42 32 39 28 Q 35 32 31 28 Q 27 32 23 28 Q 20 31 19 27 Z" fill="#FCEADE" opacity="0.95"/>

  <!-- Birthday Candle -->
  <rect x="30" y="12" width="4" height="12" rx="2" fill="#FFFFFF" stroke="#E07A5F" stroke-width="0.8"/>
  <path d="M 30.5 15.5 L 33.5 14 M 30.5 18.5 L 33.5 17 M 30.5 21.5 L 33.5 20" stroke="#FF5D8F" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Candle Wick -->
  <line x1="32" y1="12" x2="32" y2="9.5" stroke="#4A4036" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Candle Flame -->
  <path d="M 32 2 C 28.5 6.5 28 9.5 32 11.5 C 36 9.5 35.5 6.5 32 2 Z" fill="url(#flameGrad)" filter="url(#flameGlow)"/>
  <circle cx="32" cy="8" r="1.3" fill="#FFFDF0"/>

  <!-- Sparkles ✨ & Decorative Elements -->
  <!-- Top Left Sparkle -->
  <path d="M 9 14 L 11 18 L 15 20 L 11 22 L 9 26 L 7 22 L 3 20 L 7 18 Z" fill="#FFB703"/>
  <!-- Top Right Mini Sparkle -->
  <path d="M 54 12 L 55 15 L 58 16 L 55 17 L 54 20 L 53 17 L 50 16 L 53 15 Z" fill="#FFD166"/>
  
  <!-- Cute Love Heart on side -->
  <path d="M 53 31 C 51.5 29 48 30 48 32.5 C 48 35.5 53 38.5 53 38.5 C 53 38.5 58 35.5 58 32.5 C 58 30 54.5 29 53 31 Z" fill="url(#heartGrad)"/>
</svg>